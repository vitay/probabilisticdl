project:
  type: book
  output-dir: ./docs

book:
  title: "Probabilistic deep learning"
  subtitle: "From maximum likelihood to diffusion models"
  author:
    - name: Dr. Julien Vitay 
      email: julien.vitay@gmail.com
      url: https://julien-vitay.net
      orcid: 0000-0001-5229-2349
  
  page-navigation: true
  bread-crumbs: false

  sidebar:
    style: docked
    background: white

  page-footer:
    center: |
      [Creative Commons BY-NC-SA 4.0](http://creativecommons.org/licenses/by-nc-sa/4.0). Author [Julien Vitay](mailto:julien.vitay@gmail.com)

  chapters:
    - index.qmd
    - part: "**Basics**"
      chapters:
        - src/basics/1-InformationTheory.qmd
        - src/basics/2-MLE.qmd
        - src/basics/3-Bayesian.qmd
    - part: "**Statistical machine learning**"
      chapters:
        - src/statisticalml/1-Paradigms.qmd
        - src/statisticalml/2-KL.qmd
        - src/statisticalml/3-Softmax.qmd
        - src/statisticalml/4-MDN.qmd
    - part: "**Sampling methods**"
      chapters:
        - src/sampling/1-MonteCarlo.qmd
        - src/sampling/2-MCMC.qmd
        - src/sampling/3-HMC.qmd
    - part: "**Variational inference**"
      chapters:
        - src/variationalinference/1-LatentVariables.qmd
        - src/variationalinference/2-VariationalInference.qmd
        - src/variationalinference/3-VAE.qmd
        - src/variationalinference/4-GradientEstimators.qmd
        - src/variationalinference/5-TighterBounds.qmd
    - part: "**Deep generative models**"
      chapters:
        - src/generative/1-Diffusion.qmd
        - src/generative/2-ConditionalDiffusion.qmd
        - src/generative/3-OptimalTransport.qmd
        - src/generative/4-FlowMatching.qmd
    - src/references.qmd

bibliography: 
    - Library.bib
csl: assets/frontiers.csl

format:
  html:
    mainfont: Roboto
    theme: [lumen, "assets/webpage.scss"]
    number-sections: false
    toc: true
    smooth-scroll: true
    html-math-method: katex
    highlight-style: github
    code-line-numbers: false
    lightbox: true
    page-layout: full

    grid:
      sidebar-width: 300px
